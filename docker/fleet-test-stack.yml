# Disposable robot-fleet-management API for fleet_bridge checks (DECISIONS,
# 2026-10-14): its own Postgres with no host port and no volume, so `down`
# deletes everything, and the API on host port 8001, so a fleet stack on
# 8000 is never touched. Built from a fleet-repo checkout of main: FLEET_BACKEND,
# or by default a robot-fleet-management checkout next to this repo.
#
#   FLEET_BACKEND=C:/path/to/robot-fleet-management/backend \
#     docker compose -f docker/fleet-test-stack.yml up -d --build
#   docker compose -f docker/fleet-test-stack.yml exec api python -m app.scripts.seed_e2e_users
#   docker compose -f docker/fleet-test-stack.yml down
#
# ACCESS_TOKEN_EXPIRE_MINUTES (default 60) can be set to 1 to make the bridge
# refresh its token every minute, and a new FLEET_SECRET_KEY makes it log in
# again. From the vision_bot container the API is
# http://host.docker.internal:8001/api/v1.
name: fleet-v2-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ${FLEET_BACKEND:-../../robot-fleet-management/backend}
    environment:
      DATABASE_URL: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet
      # Changing it invalidates every issued token, refresh tokens included.
      SECRET_KEY: ${FLEET_SECRET_KEY:-fleet-v2-test-stack-only}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Two bridges post telemetry every second from one address (DECISIONS #65).
      RATE_LIMIT_DEFAULT: 1000/minute
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
