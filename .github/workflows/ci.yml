name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ros:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:humble-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-humble-cv-bridge \
            python3-opencv \
            python3-numpy \
            python3-pytest \
            python3-flake8

      # No colcon build needed: the tests exercise pure functions
      # (compute_tracking_cmd, detect_target) via a plain PYTHONPATH import,
      # not the built/installed package -- see test/ for why they're split
      # out that way.
      - name: Run unit tests
        working-directory: ros2_ws/src/vision_bot
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE/ros2_ws/src/vision_bot"
          python3 -m pytest test/ -v

      - name: Lint (flake8)
        working-directory: ros2_ws/src/vision_bot
        run: python3 -m flake8 --max-line-length=100 vision_bot/ test/

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production build runs Next.js's type-checker -- this is what
      # originally caught the missing @types/roslib bug (roslib ships no
      # bundled types), before this job existed to catch it automatically.
      - name: Build (typecheck + compile)
        run: npm run build
