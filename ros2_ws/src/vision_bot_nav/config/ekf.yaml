# robot_localization EKF. Started from the installed
# /opt/ros/humble/share/robot_localization/params/ekf.yaml and cut down to
# the minimal fusion the plan calls for; add inputs only if a benchmark
# shows they help.
#
# Output: odometry/filtered, and the odom -> base_link transform (the EKF is
# that transform's only publisher; the drive plugin's TF output is off).
#
# Each *_config row is 15 booleans in this order:
#   x, y, z, roll, pitch, yaw,
#   vx, vy, vz, vroll, vpitch, vyaw,
#   ax, ay, az
#
# "/**" so the same file works under a robot namespace (Task 5).
/**:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true          # planar robot: ignore z, roll, pitch
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom         # this filter estimates odom -> base_link

    # Wheel odometry: forward speed and turn rate. Fusing velocities rather
    # than the integrated pose lets the filter do the integrating.
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: turn rate only (gyro z). Its covariance is far smaller than the
    # wheel odometry's yaw-rate covariance, so heading follows the gyro.
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
